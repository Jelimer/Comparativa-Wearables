<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-charge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-charge)" />

  <!-- Band strap vertical continuous -->
  <rect x="120" y="20" width="60" height="260" rx="16" fill="#334155" />

  <!-- Tracker Module -->
  <rect x="112" y="70" width="76" height="160" rx="24" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
  <rect x="122" y="85" width="56" height="130" rx="14" fill="#0f172a" />

  <!-- Screen UI -->
  <text x="150" y="120" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">10:08</text>
  <path d="M135 145 C 140 135, 145 155, 150 140 C 155 150, 160 138, 165 145" fill="none" stroke="#a5b4fc" stroke-width="2" />
  <text x="150" y="170" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">8,420</text>
  <text x="150" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">PASOS</text>

  <!-- Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fitbit Charge 6</text>
</svg>
