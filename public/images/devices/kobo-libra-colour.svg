<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-libra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-libra)" />

  <!-- Kobo Libra Colour Asymmetric Ergonomic Body (White / Silver Edition) -->
  <rect x="52" y="32" width="195" height="210" rx="14" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2.5" />
  
  <!-- 7.0" Color Screen on the left -->
  <rect x="62" y="42" width="138" height="190" rx="4" fill="#faf5ff" />

  <!-- Color Cover Graphic Simulation -->
  <rect x="70" y="50" width="122" height="65" rx="3" fill="#ede9fe" />
  <circle cx="110" cy="78" r="14" fill="#a855f7" opacity="0.8" />
  <circle cx="145" cy="78" r="14" fill="#ec4899" opacity="0.8" />
  <text x="131" y="105" text-anchor="middle" fill="#581c87" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">KALEIDO 3 COLOR (7.0")</text>

  <!-- Handwritten annotations with stylus simulation -->
  <path d="M72 135 Q100 128 140 135" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="74" y="130" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="6" font-style="italic">¡Excelente nota al margen!</text>

  <!-- Physical Buttons on the Right Bezel -->
  <rect x="208" y="78" width="28" height="50" rx="8" fill="#e2e8f0" stroke="#8b5cf6" stroke-width="1.5" />
  <path d="M222 96 L222 108 M217 102 L222 96 L227 102" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <rect x="208" y="145" width="28" height="50" rx="8" fill="#e2e8f0" stroke="#8b5cf6" stroke-width="1.5" />
  <path d="M222 162 L222 174 M217 168 L222 174 L227 168" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Stylus indicator badge -->
  <text x="222" y="215" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Stylus 2</text>

  <!-- Model Badge -->
  <rect x="40" y="258" width="220" height="26" rx="13" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kobo Libra Colour (Botones + Stylus)</text>
</svg>
