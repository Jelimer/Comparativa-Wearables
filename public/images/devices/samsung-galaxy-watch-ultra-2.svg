<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-samsung-ultra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-samsung-ultra)" />

  <!-- Orange Straps -->
  <rect x="105" y="15" width="90" height="75" rx="12" fill="#ea580c" />
  <rect x="105" y="210" width="90" height="75" rx="12" fill="#ea580c" />

  <!-- Cushion Shape Case (Squircle) -->
  <rect x="75" y="75" width="150" height="150" rx="42" fill="#334155" stroke="#f97316" stroke-width="3" />
  <circle cx="150" cy="150" r="62" fill="#0f172a" stroke="#fdba74" stroke-width="2" />

  <!-- Screen Content -->
  <text x="150" y="130" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">10:08</text>
  <text x="150" y="150" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="800">ULTRA CYCLING</text>
  <text x="150" y="170" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">FTP 280W · 168 BPM</text>
  <text x="150" y="188" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">COMP. CORPORAL BIA</text>

  <!-- Badge -->
  <rect x="40" y="258" width="220" height="26" rx="13" fill="#0f172a" stroke="#ea580c" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Samsung Galaxy Watch Ultra 2</text>
</svg>
