<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-pocket)" />

  <!-- PocketBook Era Color (7.0" with side buttons & built-in speaker) -->
  <rect x="52" y="32" width="195" height="210" rx="14" fill="#18181b" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Flush 7.0" Kaleido 3 Screen -->
  <rect x="62" y="42" width="138" height="190" rx="4" fill="#fdfbf7" />

  <!-- Color Graphic Simulation -->
  <rect x="70" y="52" width="122" height="65" rx="3" fill="#d1fae5" />
  <circle cx="110" cy="80" r="14" fill="#059669" opacity="0.8" />
  <circle cx="145" cy="80" r="14" fill="#0284c7" opacity="0.8" />
  <text x="131" y="105" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">25 FORMATOS NATIVOS</text>

  <!-- Audio Waves & Speaker Simulation -->
  <text x="74" y="132" fill="#0f172a" font-family="Georgia, serif" font-size="7.5" font-weight="bold">Altavoz Integrado & Text-to-Speech</text>
  <path d="M74 142 Q80 138 86 142 T98 142" fill="none" stroke="#10b981" stroke-width="1.5" />

  <text x="131" y="218" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">IPX8 • SMARTlight • 32GB</text>

  <!-- Physical Buttons on the Right Bezel -->
  <rect x="208" y="78" width="28" height="50" rx="8" fill="#27272a" stroke="#10b981" stroke-width="1.5" />
  <path d="M222 96 L222 108 M217 102 L222 96 L227 102" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" />

  <rect x="208" y="145" width="28" height="50" rx="8" fill="#27272a" stroke="#10b981" stroke-width="1.5" />
  <path d="M222 162 L222 174 M217 168 L222 174 L227 168" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" />

  <!-- Model Badge -->
  <rect x="40" y="258" width="220" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PocketBook Era Color (7.0" + Audio)</text>
</svg>
