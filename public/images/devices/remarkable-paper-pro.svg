<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-pro)" />

  <!-- reMarkable Paper Pro 11.8" Color + Frontlight (Anodized Dark Gray Aluminum) -->
  <rect x="36" y="20" width="206" height="232" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
  
  <!-- Left Spine Gray Strip with textured grid -->
  <rect x="36" y="20" width="20" height="232" rx="8" fill="#334155" />
  
  <!-- 11.8" Large Canvas Color Screen with Gentle Reading Frontlight -->
  <rect x="62" y="30" width="170" height="212" rx="4" fill="#fffdfa" />

  <!-- Color Elements in Notes (Gallery 3 / Canvas Color simulation) -->
  <text x="74" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="900">Canvas Color (11.8") • 12ms</text>
  
  <!-- Color Highlight Strokes -->
  <path d="M74 72 Q115 65 160 74 T215 70" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <text x="76" y="75" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Ideas Principales en Amarillo</text>

  <path d="M74 95 Q125 90 180 98" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <text x="76" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Revisión de Arquitectura Azul</text>

  <path d="M74 118 Q110 114 150 120" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <text x="76" y="121" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Puntos Críticos en Magenta</text>

  <!-- Frontlight Ambient Glow Bar -->
  <text x="147" y="232" text-anchor="middle" fill="#d97706" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Luz Frontal Integrada • 64GB</text>

  <!-- Active Marker Plus Stylus with Color Tip & Eraser -->
  <rect x="250" y="50" width="9" height="170" rx="4.5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <polygon points="250,50 259,50 254.5,36" fill="#f59e0b" />
  <rect x="250" y="210" width="9" height="10" rx="2" fill="#e2e8f0" />

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">reMarkable Paper Pro (11.8" Color)</text>
</svg>
