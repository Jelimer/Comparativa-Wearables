<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-basic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-basic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-basic)" />

  <!-- Kindle Basic 6.0" Compact Body -->
  <rect x="78" y="38" width="144" height="200" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
  <!-- Raised bezel screen -->
  <rect x="90" y="52" width="120" height="160" rx="2" fill="url(#screen-basic)" stroke="#cbd5e1" stroke-width="0.5" />

  <!-- E-Ink Text Simulation -->
  <text x="98" y="70" fill="#0f172a" font-family="Georgia, serif" font-size="8.5" font-weight="bold">158g Ultraligero</text>
  <rect x="98" y="78" width="104" height="2.5" rx="1" fill="#475569" />
  <rect x="98" y="85" width="104" height="2.5" rx="1" fill="#475569" />
  <rect x="98" y="92" width="104" height="2.5" rx="1" fill="#475569" />
  <rect x="98" y="99" width="80" height="2.5" rx="1" fill="#475569" />

  <!-- USB-C label -->
  <text x="150" y="200" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">300 PPI • USB-C</text>

  <!-- Model Badge -->
  <rect x="50" y="258" width="200" height="26" rx="13" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kindle Básico (6.0")</text>
</svg>
