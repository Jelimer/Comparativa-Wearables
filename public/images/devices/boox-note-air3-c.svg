<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-note-air" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-note-air)" />

  <!-- BOOX Note Air3 C 10.3" Color (Deep Blue Aluminum Body + Orange Accent) -->
  <rect x="42" y="24" width="195" height="225" rx="14" fill="#0f172a" stroke="#ea580c" stroke-width="2.5" />
  
  <!-- Massive Screen 10.3" Color Kaleido 3 -->
  <rect x="72" y="36" width="155" height="200" rx="4" fill="#fdf4ff" />

  <!-- Split Screen / Color Sketch Simulation -->
  <rect x="80" y="46" width="65" height="180" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
  <text x="85" y="60" fill="#0f172a" font-family="Georgia, serif" font-size="7" font-weight="bold">Documento Técnico</text>
  <rect x="85" y="68" width="55" height="2" fill="#475569" />
  <rect x="85" y="74" width="55" height="2" fill="#475569" />
  <rect x="85" y="80" width="40" height="2" fill="#475569" />

  <!-- Color canvas side -->
  <rect x="152" y="46" width="65" height="180" rx="3" fill="#fefce8" stroke="#e2e8f0" stroke-width="0.5" />
  <text x="156" y="60" fill="#ea580c" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Color & BSR 10.3"</text>
  <circle cx="184" cy="90" r="18" fill="#f97316" opacity="0.8" />
  <circle cx="170" cy="115" r="12" fill="#3b82f6" opacity="0.8" />

  <!-- Wacom Magnetic Stylus -->
  <rect x="245" y="55" width="9" height="160" rx="4" fill="#334155" stroke="#ea580c" stroke-width="1.5" />
  <polygon points="245,55 254,55 249.5,42" fill="#1e293b" />
  <circle cx="249.5" cy="44" r="1.5" fill="#f97316" />

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#431407" stroke="#ea580c" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BOOX Note Air3 C (10.3" Color + Android)</text>
</svg>
