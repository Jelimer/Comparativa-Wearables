<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-page)" />

  <!-- BOOX Page 7.0" (Asymmetric with Magnetic Back & Buttons) -->
  <rect x="52" y="32" width="195" height="210" rx="14" fill="#09090b" stroke="#f97316" stroke-width="2.5" />
  
  <!-- Flush 7.0" Carta 1200 Screen -->
  <rect x="62" y="42" width="138" height="190" rx="4" fill="#f8fafc" />

  <!-- E-Ink Text Simulation -->
  <text x="72" y="64" fill="#0f172a" font-family="Georgia, serif" font-size="9" font-weight="bold">Android 11 + Google Play</text>
  <rect x="72" y="74" width="118" height="2.5" rx="1" fill="#334155" />
  <rect x="72" y="82" width="118" height="2.5" rx="1" fill="#334155" />
  <rect x="72" y="90" width="118" height="2.5" rx="1" fill="#334155" />
  <rect x="72" y="98" width="118" height="2.5" rx="1" fill="#334155" />
  <rect x="72" y="106" width="85" height="2.5" rx="1" fill="#334155" />

  <text x="131" y="218" text-anchor="middle" fill="#ea580c" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Slot MicroSD • Altavoces Duales</text>

  <!-- Physical Buttons on the Right Bezel -->
  <rect x="208" y="78" width="28" height="50" rx="8" fill="#18181b" stroke="#f97316" stroke-width="1.5" />
  <path d="M222 96 L222 108 M217 102 L222 96 L227 102" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" />

  <rect x="208" y="145" width="28" height="50" rx="8" fill="#18181b" stroke="#f97316" stroke-width="1.5" />
  <path d="M222 162 L222 174 M217 168 L222 174 L227 168" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" />

  <!-- Model Badge -->
  <rect x="40" y="258" width="220" height="26" rx="13" fill="#431407" stroke="#f97316" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BOOX Page (7.0" + Botones + Play Store)</text>
