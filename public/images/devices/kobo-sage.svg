      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-sage)" />

  <!-- Kobo Sage 8.0" (Wide Screen with Ergonomic Grip) -->
  <rect x="44" y="28" width="210" height="218" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />
  
  <!-- 8.0" Screen on the left -->
  <rect x="54" y="38" width="150" height="198" rx="4" fill="#f8fafc" />

  <!-- E-Ink Carta 1200 Text Simulation -->
