  <rect x="64" y="70" width="130" height="3" rx="1.5" fill="#334155" />
  <rect x="64" y="78" width="130" height="3" rx="1.5" fill="#334155" />
  <rect x="64" y="86" width="130" height="3" rx="1.5" fill="#334155" />
  <rect x="64" y="94" width="130" height="3" rx="1.5" fill="#334155" />
  <rect x="64" y="102" width="130" height="3" rx="1.5" fill="#334155" />
  <rect x="64" y="110" width="95" height="3" rx="1.5" fill="#334155" />

  <text x="129" y="222" text-anchor="middle" fill="#0284c7" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Dropbox & Google Drive Integrados</text>

  <!-- Physical Buttons on the Right Bezel -->
  <rect x="214" y="80" width="30" height="52" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
  <path d="M229 100 L229 112 M224 106 L229 100 L234 106" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <rect x="214" y="145" width="30" height="52" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
  <path d="M229 164 L229 176 M224 170 L229 176 L234 170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

