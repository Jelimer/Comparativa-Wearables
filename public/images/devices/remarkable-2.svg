<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rm2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metal-rm2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-rm2)" />

  <!-- reMarkable 2 (Ultrafine 4.7mm Aluminum Body with distinct left white bezel) -->
  <rect x="42" y="24" width="195" height="225" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Left Spine Gray Strip (Iconic reMarkable design) -->
  <rect x="42" y="24" width="22" height="225" rx="6" fill="#e2e8f0" />
  <circle cx="53" cy="38" r="3" fill="#64748b" />

  <!-- 10.3" CANVAS Screen -->
  <rect x="70" y="34" width="158" height="205" rx="3" fill="#ffffff" />

  <!-- Minimalist Clean Notebook Canvas -->
  <text x="82" y="55" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Notas & Bocetos Rápidos</text>
  
  <!-- Subtle Grid of Dots -->
  <circle cx="85" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="105" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="125" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="145" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="165" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="185" cy="72" r="0.8" fill="#94a3b8" />
  <circle cx="205" cy="72" r="0.8" fill="#94a3b8" />

  <circle cx="85" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="105" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="125" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="145" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="165" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="185" cy="92" r="0.8" fill="#94a3b8" />
  <circle cx="205" cy="92" r="0.8" fill="#94a3b8" />

  <!-- Realistic Pencil Sketch Simulation (Organic Flow) -->
  <path d="M85 85 Q115 70 150 88 T210 82" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M85 115 Q125 100 170 120" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
  <rect x="85" y="138" width="60" height="40" rx="3" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2" />
  <text x="115" y="162" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">Diagrama</text>

  <!-- Marker Plus Stylus with Black Tip & Eraser Top -->
  <rect x="245" y="55" width="8" height="160" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="245,55 253,55 249,42" fill="#e2e8f0" />
  <!-- Marker Plus Eraser -->
  <rect x="245" y="205" width="8" height="10" rx="2" fill="#cbd5e1" />

  <!-- Model Badge -->
  <rect x="40" y="258" width="220" height="26" rx="13" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">reMarkable 2 (4.7mm + Marker Plus)</text>
</svg>
