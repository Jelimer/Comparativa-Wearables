<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fitbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-sense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-fitbit)" />

  <!-- Straps -->
  <rect x="115" y="15" width="70" height="75" rx="10" fill="#1f2937" />
  <rect x="115" y="210" width="70" height="75" rx="10" fill="#1f2937" />

  <!-- Watch Body (Squircle) -->
  <rect x="85" y="75" width="130" height="150" rx="36" fill="#374151" stroke="#10b981" stroke-width="2.5" />
  <rect x="95" y="85" width="110" height="130" rx="26" fill="url(#screen-sense)" />

  <!-- Screen content -->
  <text x="150" y="125" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">10:08</text>
  <text x="150" y="145" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Fitbit Daily Readiness</text>

  <!-- ECG / cEDA icon & value -->
  <circle cx="150" cy="172" r="16" fill="#065f46" stroke="#34d399" stroke-width="2" />
  <text x="150" y="176" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="800">EDA</text>
  <text x="150" y="202" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Estrés: Bajo (Score 88)</text>

  <!-- Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fitbit Sense 2</text>
</svg>
