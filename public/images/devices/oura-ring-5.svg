      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ring-oura5-finish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
