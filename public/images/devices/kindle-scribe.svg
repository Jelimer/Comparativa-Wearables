<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-scribe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-scribe)" />

  <!-- Kindle Scribe 10.2" Large Body -->
  <rect x="45" y="24" width="190" height="225" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
  
  <!-- Massive Screen 10.2" with left margin -->
  <rect x="75" y="36" width="150" height="200" rx="4" fill="#fafaf9" />

  <!-- E-Ink Notebook / PDF Simulation -->
  <text x="85" y="55" fill="#1e1b4b" font-family="Georgia, serif" font-size="9" font-weight="bold">Cuaderno de Ideas & Notas</text>
  
  <!-- Grid Lines -->
  <line x1="85" y1="68" x2="215" y2="68" stroke="#e2e8f0" stroke-width="1" />
  <line x1="85" y1="88" x2="215" y2="88" stroke="#e2e8f0" stroke-width="1" />
  <line x1="85" y1="108" x2="215" y2="108" stroke="#e2e8f0" stroke-width="1" />
  <line x1="85" y1="128" x2="215" y2="128" stroke="#e2e8f0" stroke-width="1" />
  <line x1="85" y1="148" x2="215" y2="148" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Handwritten simulation handwriting stroke -->
  <path d="M90 82 Q120 75 160 84 T200 80" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" />
  <path d="M90 102 Q130 96 175 104" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Premium Stylus Pen attached magnetically on right side -->
  <rect x="242" y="50" width="10" height="170" rx="5" fill="#334155" stroke="#6366f1" stroke-width="1.5" />
  <polygon points="242,50 252,50 247,38" fill="#1e293b" />
  <circle cx="247" cy="40" r="1.5" fill="#6366f1" />

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kindle Scribe (10.2" + Lápiz Prémium)</text>
</svg>
