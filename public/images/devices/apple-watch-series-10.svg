<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="screen-apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-apple)" />

  <!-- Loop Strap -->
  <rect x="110" y="15" width="80" height="75" rx="12" fill="#3f3f46" />
  <rect x="110" y="210" width="80" height="75" rx="12" fill="#3f3f46" />

  <!-- Ultra-thin Aluminum / Jet Black case -->
  <rect x="80" y="70" width="140" height="160" rx="40" fill="#09090b" stroke="#fa243c" stroke-width="2.5" />
  <rect x="88" y="78" width="124" height="144" rx="32" fill="url(#screen-apple)" />

  <!-- Digital Crown -->
  <rect x="220" y="125" width="8" height="30" rx="4" fill="#a1a1aa" />

  <!-- Activity Rings UI -->
  <circle cx="150" cy="150" r="42" fill="none" stroke="#fa243c" stroke-width="7" />
  <circle cx="150" cy="150" r="32" fill="none" stroke="#a3e635" stroke-width="7" />
  <circle cx="150" cy="150" r="22" fill="none" stroke="#38bdf8" stroke-width="7" />

  <text x="150" y="154" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900">10:08</text>

  <!-- Badge -->
  <rect x="50" y="258" width="200" height="26" rx="13" fill="#0f172a" stroke="#fa243c" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Apple Watch Series 10</text>
</svg>
