<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-elipsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-elipsa)" />

  <!-- Kobo Elipsa 2E 10.3" Large Body -->
  <rect x="42" y="24" width="195" height="225" rx="14" fill="#0f172a" stroke="#059669" stroke-width="2.5" />
  
  <!-- Massive Screen 10.3" -->
  <rect x="72" y="36" width="155" height="200" rx="4" fill="#f8fafc" />

  <!-- Document & Annotations Simulation -->
  <text x="82" y="55" fill="#064e3b" font-family="Georgia, serif" font-size="9" font-weight="bold">Documento Técnico PDF (10.3")</text>
  
  <!-- Chart / Graph Simulation -->
  <rect x="82" y="68" width="135" height="60" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5" />
  <polyline points="90,115 115,95 145,105 175,80 205,72" fill="none" stroke="#059669" stroke-width="2" />
  <circle cx="175" cy="80" r="3" fill="#059669" />

  <!-- Handwritten annotations with stylus -->
  <path d="M85 145 Q125 138 180 148" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
  <text x="85" y="160" fill="#047857" font-family="system-ui, sans-serif" font-size="6.5" font-style="italic">Revisar balance energético</text>

  <!-- Kobo Stylus 2 Pen -->
  <rect x="245" y="55" width="9" height="160" rx="4" fill="#334155" stroke="#059669" stroke-width="1.5" />
  <polygon points="245,55 254,55 249.5,42" fill="#1e293b" />
  <circle cx="249.5" cy="44" r="1.5" fill="#10b981" />

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kobo Elipsa 2E (10.3" + Stylus 2)</text>
</svg>
