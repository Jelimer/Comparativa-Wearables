<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-oasis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metal-oasis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-oasis)" />

  <!-- Asymmetric Ergonomic Metal Body -->
  <rect x="55" y="32" width="190" height="210" rx="12" fill="url(#metal-oasis)" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Flush 7.0" Screen (Offset to the left) -->
  <rect x="65" y="42" width="135" height="190" rx="4" fill="#f8fafc" />

  <!-- Physical Page Turn Buttons on the Right Bezel -->
  <rect x="212" y="80" width="22" height="48" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1" />
  <path d="M223 98 L223 108 M219 103 L223 98 L227 103" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="212" y="145" width="22" height="48" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1" />
  <path d="M223 162 L223 172 M219 167 L223 172 L227 167" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- E-Ink Text Simulation -->
  <text x="75" y="65" fill="#0f172a" font-family="Georgia, serif" font-size="8.5" font-weight="bold">Diseño Ergonómico</text>
  <rect x="75" y="74" width="115" height="2.5" rx="1" fill="#475569" />
  <rect x="75" y="82" width="115" height="2.5" rx="1" fill="#475569" />
  <rect x="75" y="90" width="115" height="2.5" rx="1" fill="#475569" />
  <rect x="75" y="98" width="115" height="2.5" rx="1" fill="#475569" />
  <rect x="75" y="106" width="90" height="2.5" rx="1" fill="#475569" />

  <text x="132" y="218" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">Giroscopio Automático • IPX8</text>

  <!-- Model Badge -->
  <rect x="45" y="258" width="210" height="26" rx="13" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kindle Oasis (Botones Físicos)</text>
</svg>
