<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-sig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-sig)" />

  <!-- Kindle Paperwhite Signature Edition (Metallic green / agave trim) -->
  <rect x="70" y="30" width="160" height="215" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
  <rect x="82" y="44" width="136" height="180" rx="4" fill="url(#screen-sig)" />

  <!-- Auto warm light sensor indicator -->
  <circle cx="150" cy="38" r="2" fill="#10b981" />

  <!-- E-Ink Text Simulation with warm tint -->
  <text x="92" y="65" fill="#1e293b" font-family="Georgia, serif" font-size="9" font-weight="bold">El Gran Gatsby</text>
  <rect x="92" y="74" width="116" height="3" rx="1.5" fill="#475569" />
  <rect x="92" y="82" width="116" height="3" rx="1.5" fill="#475569" />
  <rect x="92" y="90" width="116" height="3" rx="1.5" fill="#475569" />
  <rect x="92" y="98" width="116" height="3" rx="1.5" fill="#475569" />
  <rect x="92" y="106" width="100" height="3" rx="1.5" fill="#475569" />

  <!-- Wireless Qi Charging Icon at bottom -->
  <circle cx="150" cy="180" r="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="150" y="184" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Qi 32GB</text>

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kindle Paperwhite Signature (32GB)</text>
</svg>
