<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lenovo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metal-lenovo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-lenovo)" />

  <!-- Lenovo Smart Paper 10.3" (Storm Grey Metal Body with Red Tag Accent) -->
  <rect x="42" y="24" width="195" height="225" rx="10" fill="url(#metal-lenovo)" stroke="#ef4444" stroke-width="2" />
  
  <!-- Iconic Lenovo Red Tag on Left Bezel -->
  <rect x="42" y="38" width="18" height="35" rx="2" fill="#ef4444" />
  <text x="51" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6" font-weight="900" transform="rotate(-90 51 60)">Lenovo</text>

  <!-- 10.3" Screen with Dual Tone Warm Light -->
  <rect x="66" y="34" width="162" height="205" rx="3" fill="#fdfbf7" />

  <!-- Voice Recording Sync Waveform Banner -->
  <rect x="74" y="44" width="146" height="26" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <circle cx="86" cy="57" r="4" fill="#ef4444" />
  <text x="96" y="60" fill="#991b1b" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Grabación de Voz Sincronizada</text>

  <!-- Handwritten notes with audio markers -->
  <text x="76" y="90" fill="#0f172a" font-family="Georgia, serif" font-size="8" font-weight="bold">Acta de Reunión de Estrategia</text>
  
  <rect x="76" y="100" width="135" height="2.5" rx="1" fill="#475569" />
  <rect x="76" y="108" width="135" height="2.5" rx="1" fill="#475569" />
  <rect x="76" y="116" width="135" height="2.5" rx="1" fill="#475569" />
  <rect x="76" y="124" width="95" height="2.5" rx="1" fill="#475569" />

  <!-- Audio Timestamp Pins on Margin -->
  <circle cx="78" cy="142" r="3" fill="#ef4444" />
  <text x="86" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">[12:45] Tocar texto para escuchar audio</text>

  <text x="147" y="230" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">Lápiz EMR sin batería + Funda Folio incluida</text>

  <!-- Smart Paper Pen -->
  <rect x="245" y="55" width="8" height="160" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
  <polygon points="245,55 253,55 249,42" fill="#ef4444" />
  <circle cx="249" cy="45" r="1" fill="#ffffff" />

  <!-- Model Badge -->
  <rect x="35" y="258" width="230" height="26" rx="13" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Lenovo Smart Paper (10.3" + Audio Sync)</text>
</svg>
