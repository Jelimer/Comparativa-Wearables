<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-whoop5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="strap-whoop5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-whoop5)" />

  <!-- Fabric Knit Band Loop -->
  <rect x="70" y="80" width="160" height="130" rx="30" fill="none" stroke="url(#strap-whoop5)" stroke-width="32" />
  <rect x="70" y="80" width="160" height="130" rx="30" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.6" />

  <!-- Sensor Module Body (Screenless, Sleek 7% thinner) -->
  <rect x="110" y="105" width="80" height="80" rx="16" fill="#09090b" stroke="#22c55e" stroke-width="2.5" />
  
  <!-- LED Status Pulse -->
  <circle cx="150" cy="135" r="8" fill="#22c55e" />
  <circle cx="150" cy="135" r="14" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.7" />

  <text x="150" y="168" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">WHOOP 5.0</text>
  <text x="150" y="228" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="600">14+ Days Battery · Any-Wear</text>

  <!-- Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Whoop 5.0</text>
</svg>
