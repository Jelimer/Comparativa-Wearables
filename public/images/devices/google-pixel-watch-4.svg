<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-pixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="strap-pixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow-pixel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="300" height="300" rx="24" fill="url(#bg-pixel)" />

  <!-- Watch Strap Top & Bottom -->
  <rect x="110" y="20" width="80" height="70" rx="12" fill="url(#strap-pixel)" />
  <rect x="110" y="210" width="80" height="70" rx="12" fill="url(#strap-pixel)" />

  <!-- Outer Crown Ring -->
  <circle cx="150" cy="150" r="76" fill="#475569" filter="url(#glow-pixel)" />
  <circle cx="150" cy="150" r="72" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />

  <!-- Crown Button -->
  <rect x="222" y="138" width="10" height="24" rx="4" fill="#94a3b8" />

  <!-- Display Screen -->
  <circle cx="150" cy="150" r="64" fill="url(#screen-pixel)" />

  <!-- Screen Content: Pixel Watch UI -->
  <!-- Clock Time -->
  <text x="150" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">10:08</text>
  <text x="150" y="152" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LUN 27 JUL</text>

  <!-- Heart Rate Wave & Value -->
  <path d="M120 172 H132 L137 163 L143 181 L149 167 L154 175 L159 172 H180" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="150" y="195" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="12" font-weight="700">72 PPM · SpO2 98%</text>

  <!-- Brand Label Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Google Pixel Watch 4</text>
</svg>
