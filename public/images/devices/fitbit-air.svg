<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-air" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-air)" />

  <!-- Fabric band loop -->
  <rect x="90" y="50" width="120" height="180" rx="30" fill="none" stroke="#38bdf8" stroke-width="18" opacity="0.4" />
  <rect x="95" y="55" width="110" height="170" rx="26" fill="none" stroke="#e0f2fe" stroke-width="6" />

  <!-- Biometric Sensor Hub -->
  <rect x="110" y="110" width="80" height="80" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="150" cy="150" r="20" fill="#0284c7" opacity="0.3" />
  <circle cx="150" cy="150" r="10" fill="#38bdf8" />

  <text x="150" y="210" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SCREENLESS SENSOR HUB</text>

  <!-- Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fitbit Air Band</text>
</svg>
