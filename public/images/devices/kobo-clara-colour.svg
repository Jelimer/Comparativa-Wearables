  <rect x="96" y="54" width="108" height="60" rx="3" fill="#fbcfe8" />
  <circle cx="130" cy="80" r="14" fill="#f43f5e" opacity="0.8" />
  <circle cx="170" cy="80" r="14" fill="#8b5cf6" opacity="0.8" />
  <circle cx="150" cy="90" r="10" fill="#06b6d4" opacity="0.8" />

