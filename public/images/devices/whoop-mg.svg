<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-whoopmg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="strap-whoopmg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-whoopmg)" />

  <!-- Fabric Band Loop -->
  <rect x="70" y="80" width="160" height="130" rx="30" fill="none" stroke="url(#strap-whoopmg)" stroke-width="32" />
  <rect x="70" y="80" width="160" height="130" rx="30" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />

  <!-- Medical Grade Sensor Body -->
  <rect x="105" y="105" width="90" height="80" rx="16" fill="#09090b" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- ECG Cross & Pulse Wave -->
  <path d="M125 145 H135 L140 132 L147 158 L153 140 L158 148 L163 145 H175" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <text x="150" y="172" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">WHOOP MG</text>
  <text x="150" y="228" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Medical ECG · Daily BP</text>

  <!-- Badge -->
  <rect x="60" y="258" width="180" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Whoop MG</text>
</svg>
