<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kobo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-kobo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#bg-kobo)" />

  <!-- Kobo Clara BW 6.0" (Eco-recycled plastic back with blue accent) -->
  <rect x="76" y="34" width="148" height="205" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  <rect x="88" y="46" width="124" height="166" rx="4" fill="url(#screen-kobo)" />

  <!-- E-Ink Carta 1300 Ultra High Contrast Text -->
  <text x="96" y="66" fill="#020617" font-family="Georgia, serif" font-size="9" font-weight="900">Carta 1300 E-Ink</text>
  <rect x="96" y="74" width="108" height="3" rx="1.5" fill="#020617" />
  <rect x="96" y="82" width="108" height="3" rx="1.5" fill="#020617" />
  <rect x="96" y="90" width="108" height="3" rx="1.5" fill="#020617" />
  <rect x="96" y="98" width="85" height="3" rx="1.5" fill="#020617" />

  <text x="150" y="195" text-anchor="middle" fill="#0891b2" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">ComfortLight PRO • IPX8</text>

  <!-- Kobo Logo in Bezel -->
  <text x="150" y="228" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">kobo</text>

  <!-- Model Badge -->
  <rect x="45" y="258" width="210" height="26" rx="13" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
  <text x="150" y="275" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kobo Clara BW (Carta 1300)</text>
</svg>
